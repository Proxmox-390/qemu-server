# s390x VM with IUCV network devices of both kinds and the option iucv
arch: s390x
iucv: full,userid=LINUX1
memory: 2048
net0: qeth=BC:24:11:00:00:01,bridge=vmbr0,devno=0.0.0600
net1: iucv-net=BC:24:11:00:00:02,bridge=vmbr0,iucv-gw=10.0.3.1,iucv-ip=10.0.3.2/24,iucv-peer=TCPIP,mtu=1
net2: iucv-tcpip=BC:24:11:00:00:03,bridge=vmbr0,firewall=1,iucv-dns=192.0.2.53;198.51.100.53,iucv-domain=example.com,iucv-gw=192.0.2.1,iucv-hostname=guest,iucv-ip=192.0.2.20/24,iucv-peer=TCPIP2,tag=100
ostype: other
