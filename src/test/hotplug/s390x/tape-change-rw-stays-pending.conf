# TEST: a writable medium for a tape drive of the running VM that started read-only waits for a restart
# HOST_ARCH: s390x
# STAYS_PENDING: 1
cores: 2
memory: 2048
name: hotplug
ostype: other
scsi0: local:8006/vm-8006-disk-0.qcow2,size=32G
scsihw: virtio-scsi-single
tape0: local:iso/SYSTEM.AWS

[PENDING]
tape0: local:iso/SCRATCH.aws,rw=1
