# TEST: a medium that is not in the ISO images content cannot be loaded writable into the running VM
# HOST_ARCH: s390x
# STAYS_PENDING: 1
# EXPECTED_ERROR: tape0: hotplug problem - tape0: only tape images in the ISO images content of a storage can be writable, not 'local:8006/vm-8006-disk-1.raw'
cores: 2
memory: 2048
name: hotplug
ostype: other
scsi0: local:8006/vm-8006-disk-0.qcow2,size=32G
scsihw: virtio-scsi-single
tape0: local:iso/SCRATCH.aws,rw=1

[PENDING]
tape0: local:8006/vm-8006-disk-1.raw,rw=1
